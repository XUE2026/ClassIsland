name: Build Android APK

on:
  push:
    branches:
      - android_environment
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" 2>&1 || true
          echo "SDK setup complete"

      - name: Create local.properties
        working-directory: ClassIsland.Android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Gradle Wrapper
        working-directory: ClassIsland.Android
        run: gradle wrapper --gradle-version 8.5

      - name: Clean and build
        working-directory: ClassIsland.Android
        continue-on-error: false
        run: |
          echo "=== Running gradle tasks ==="
          ./gradlew --version
          echo "=== Checking project ==="
          ./gradlew projects --no-daemon 2>&1
          echo "=== Building ==="
          ./gradlew assembleDebug --no-daemon --info 2>&1

      - name: Save APK to workspace
        run: |
          mkdir -p /workspace/github/actions/${{ github.run_id }}
          cp -r ClassIsland.Android/app/build/outputs/apk/* /workspace/github/actions/${{ github.run_id }}/ 2>/dev/null || true
          find /workspace/github/actions/ -name "*.apk" -ls 2>/dev/null || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: classisland-android-apk
          path: ClassIsland.Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn