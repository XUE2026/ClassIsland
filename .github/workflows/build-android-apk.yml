name: Build Android APK

on:
  push:
    branches:
      - android_environment
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Gradle info
        working-directory: ClassIsland.Android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --version 2>&1

      - name: List available tasks
        working-directory: ClassIsland.Android
        run: ./gradlew tasks --all --no-daemon 2>&1 | head -100

      - name: Assemble debug
        working-directory: ClassIsland.Android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon --info 2>&1 | tail -200

      - name: Dump build outputs
        if: always()
        run: |
          find ClassIsland.Android -type f 2>/dev/null | sort > /tmp/files2.txt
          echo "=== Files containing 'apk' ==="
          grep -i "apk" /tmp/files2.txt || echo "No APK files"
          echo "=== Files containing 'output' ==="
          grep -i "output" /tmp/files2.txt || echo "No output files"
          echo "=== build directory ==="
          find ClassIsland.Android/app/build -type f 2>/dev/null | head -50 || echo "No build dir"

      - name: Upload file list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: files2
          path: /tmp/files2.txt
          if-no-files-found: error