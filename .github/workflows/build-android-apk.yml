name: Build Android APK

on:
  push:
    branches:
      - android_environment
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Setup and build
        working-directory: ClassIsland.Android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -50

      - name: Find and save APK
        run: |
          echo "=== APK find ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "NOT FOUND"
          echo "=== build dir ==="
          ls -la ClassIsland.Android/app/build/outputs/ 2>/dev/null || echo "NO OUTPUTS"

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: classisland-apk
          path: ClassIsland.Android/app/build/outputs/
          if-no-files-found: warn