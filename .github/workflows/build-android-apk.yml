name: Build Android APK

on:
  push:
    branches:
      - android_environment
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Setup and build
        working-directory: ClassIsland.Android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -50

      - name: Dump build tree
        run: |
          find ClassIsland.Android -type f 2>/dev/null | sort > /tmp/files.txt
          wc -l /tmp/files.txt
          grep -i "apk\|aab\|output\|build" /tmp/files.txt || echo "No matches"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: files-txt
          path: /tmp/files.txt
          if-no-files-found: error