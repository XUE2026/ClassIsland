name: Build Android APK

on:
  push:
    branches:
      - android_environment
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Setup and build
        working-directory: ClassIsland.Android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -100

      - name: Debug - list all build outputs
        run: |
          echo "=== Full tree of app/build ==="
          find ClassIsland.Android/app/build -type f 2>/dev/null | head -100
          echo "=== Any APK/AAB ==="
          find ClassIsland.Android -name "*.apk" -o -name "*.aab" 2>/dev/null

      - name: Debug - check outputs/apk
        run: |
          echo "=== outputs/apk ==="
          ls -laR ClassIsland.Android/app/build/outputs/ 2>/dev/null || echo "No outputs dir"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: classisland-apk
          path: |
            ClassIsland.Android/app/build/outputs/apk/**/*.apk
            ClassIsland.Android/**/*.apk
          if-no-files-found: warn