name: Build Android APK

on:
  push:
    branches:
      - android_environment
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Generate Gradle Wrapper and Build
        working-directory: ClassIsland.Android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle wrapper --gradle-version 8.5 2>&1
          ls -la gradlew gradle/wrapper/
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Find and list APK files
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          echo "=== Build output directory ==="
          find ClassIsland.Android/ -path "*/outputs/apk/*" -type f 2>/dev/null || echo "No outputs"
          echo "=== Full build directory tree ==="
          find ClassIsland.Android/app/build/ -type d -maxdepth 5 2>/dev/null || true

      - name: Save APK to workspace
        run: |
          BUILD_ID=${{ github.run_id }}
          mkdir -p /workspace/github/actions/$BUILD_ID/产物
          APKS=$(find . -name "*.apk" -type f 2>/dev/null)
          if [ -n "$APKS" ]; then
            echo "$APKS" | while read apk; do
              echo "Saving: $apk"
              cp "$apk" /workspace/github/actions/$BUILD_ID/产物/
            done
            ls -la /workspace/github/actions/$BUILD_ID/产物/
          else
            echo "No APK files found to save"
            echo "NO_APK_BUILT" > /workspace/github/actions/$BUILD_ID/产物/status.txt
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: classisland-android-apk
          path: |
            **/*.apk
          if-no-files-found: warn