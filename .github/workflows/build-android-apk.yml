name: Build Android APK

on:
  push:
    branches:
      - android_environment
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Full build with log capture
        working-directory: ClassIsland.Android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "=== GRADLE VERSION ===" > /tmp/build.log
          ./gradlew --version 2>&1 | tee -a /tmp/build.log
          echo "=== AVAILABLE TASKS ===" >> /tmp/build.log
          ./gradlew tasks --all --no-daemon 2>&1 | tee -a /tmp/build.log
          echo "=== BUILD ===" >> /tmp/build.log
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a /tmp/build.log
          echo "=== DONE ===" >> /tmp/build.log
          echo "Build log size: $(wc -l < /tmp/build.log) lines"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-log
          path: /tmp/build.log
          if-no-files-found: error